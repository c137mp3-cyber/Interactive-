<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Монетный двор</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;900&display=swap">
<style>
:root{--bg:#1a1420;--plate:#2c2230;--brass:#e8b923;--ink:#fff5df;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#panel{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100% - 16px);box-sizing:border-box;gap:6px;padding:8px;border-radius:12px;background:#000a;font:700 14px Rubik,system-ui,sans-serif;color:var(--ink);z-index:3}
#panel button{min-width:44px;height:40px;border:1px solid #fff4;border-radius:8px;background:var(--plate);color:var(--ink);font:inherit;cursor:pointer}
#panel button[aria-pressed=true]{background:var(--brass);color:#2b1c00}
#panel button:focus-visible,#fs:focus-visible{outline:3px solid #fff}
#panel.min>button:not(#hide){display:none}
#fs{position:fixed;left:10px;top:10px;width:48px;height:48px;border:0;border-radius:10px;background:#0008;color:#fff;font-size:24px;z-index:3;transition:opacity .4s;cursor:pointer}
#fs.off{opacity:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="fs" aria-label="На весь экран">⛶</button>
<div id="panel" hidden></div>
<script src="../../core/live.js?v=19"></script>
<script src="game.js?v=19"></script>
</body>
</html>
